
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101827">
  <meta name="description" content="Convert binary, decimal, octal and hexadecimal numbers easily.">
  <link rel="manifest" href="manifest.json">
  <title>Number System Converter</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <div class="logo">01</div>
      <div>
        <h1>Number Converter</h1>
        <p class="subtitle">Simple. Fast. Accurate.</p>
      </div>
    </header>

    <section class="card">
      <label for="numberInput">Enter your number</label>
      <input
        id="numberInput"
        type="text"
        placeholder="e.g. 1010"
        autocomplete="off"
        spellcheck="false"
      >

      <div class="base-controls">
        <div class="field">
          <label for="fromBase">Convert from</label>
          <select id="fromBase">
            <option value="2">Binary (Base 2)</option>
            <option value="8">Octal (Base 8)</option>
            <option value="10" selected>Decimal (Base 10)</option>
            <option value="16">Hexadecimal (Base 16)</option>
          </select>
        </div>

        <button id="swapButton" class="swap" type="button"
          aria-label="Swap number systems" title="Swap bases">
          ⇄
        </button>

        <div class="field">
          <label for="toBase">Convert to</label>
          <select id="toBase">
            <option value="2" selected>Binary (Base 2)</option>
            <option value="8">Octal (Base 8)</option>
            <option value="10">Decimal (Base 10)</option>
            <option value="16">Hexadecimal (Base 16)</option>
          </select>
        </div>
      </div>

      <button id="convertButton" class="convert" type="button">
        Convert Number
      </button>

      <p id="errorMessage" class="error" role="alert"></p>

      <div class="result-box" aria-live="polite">
        <div class="result-heading">
          <span>Conversion result</span>
          <span id="resultBase" class="base-tag">BASE 2</span>
        </div>

        <p id="result" class="result">Your result appears here</p>

        <button id="copyButton" class="copy" type="button" disabled>
          Copy result
        </button>
      </div>
    </section>

    <section class="examples">
      <h2>Supported number systems</h2>
      <div class="base-list">
        <div><strong>BIN</strong><span>Binary · Base 2</span></div>
        <div><strong>OCT</strong><span>Octal · Base 8</span></div>
        <div><strong>DEC</strong><span>Decimal · Base 10</span></div>
        <div><strong>HEX</strong><span>Hexadecimal · Base 16</span></div>
      </div>
    </section>

    <footer>
      <p>Number System Converter · Made for learning</p>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
